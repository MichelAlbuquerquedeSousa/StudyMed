<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sem conexão · StudyMed</title>
    <meta name="theme-color" content="#fbf8fa" />
    <style>
      :root { --bg: #fbf8fa; --surface: #fff; --text: #2b2330; --muted: #6b6170; --accent: #b8436f; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #161217; --surface: #201a22; --text: #f4edf2; --muted: #b3a8b6; --accent: #f8bbd0; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; background: var(--surface); border-radius: 28px; padding: 32px 24px; box-shadow: 0 8px 30px -12px rgb(0 0 0 / .2); }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { font-size: 1.35rem; margin: 16px 0 6px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
      @media (prefers-color-scheme: dark) { button { color: #2b2330; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem internet</h1>
      <p>Esta tela ainda não tinha sido aberta neste aparelho. Assim que a conexão voltar, o StudyMed carrega normalmente.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
